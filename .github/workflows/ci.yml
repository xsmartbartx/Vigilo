name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --all-packages
      - run: uv run ruff check .

  test:
    name: Unit and contract tests
    runs-on: ubuntu-latest
    # Phase 3 added persistence/queue/object-storage-backed packages — these
    # service containers mirror docker-compose.yml's local dev stack, on
    # each service's default port (CI has no port conflict with another
    # project, unlike the shifted ports docker-compose.yml uses locally).
    # Object storage is not a service container: no MinIO image can be relied on
    # (bitnami/minio was removed from Docker Hub, quay.io/minio now answers
    # 401 to anonymous pulls), so a step below starts moto's S3-compatible
    # server from the dev dependencies. The self-hosted compose files use a different S3 stand-in.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vigilo
          POSTGRES_PASSWORD: vigilo-dev-secret
          POSTGRES_DB: vigilo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vigilo -d vigilo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://vigilo:vigilo-dev-secret@localhost:5432/vigilo
      REDIS_URL: redis://localhost:6379/0
      OBJECT_STORE_ENDPOINT: http://localhost:9000
      OBJECT_STORE_ACCESS_KEY: test
      OBJECT_STORE_SECRET_KEY: test
      OBJECT_STORE_BUCKET: vigilo-evidence
      # render_pdf() reads this to build the Playwright navigation URL — CI
      # never launches a real browser (render_pdf's own tests inject a fake
      # pdf_renderer), but this exercises the "configured" code path.
      WEB_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --all-packages
      - name: Start an S3-compatible server (moto) on :9000
        run: |
          nohup uv run moto_server -p 9000 > moto.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fs http://localhost:9000/ > /dev/null && exit 0
            sleep 1
          done
          cat moto.log
          exit 1
      - name: Create the evidence bucket
        run: |
          uv run python -c "
          import boto3
          from botocore.exceptions import ClientError
          client = boto3.client(
              's3',
              endpoint_url='http://localhost:9000',
              aws_access_key_id='test',
              aws_secret_access_key='test',
              region_name='us-east-1',
          )
          try:
              client.create_bucket(Bucket='vigilo-evidence')
          except ClientError as exc:
              if 'BucketAlreadyOwnedByYou' not in str(exc):
                  raise
          "
      - run: uv run alembic -c packages/persistence/alembic.ini upgrade head
      - run: uv run pytest -q

  # docs/prooflight-vision-and-architecture.md §18.3: "Attempts against
  # loopback, private ranges, metadata endpoints, rebinding sequences and
  # redirect chains into internal space. Any pass is a build-blocking
  # failure. Run on every commit, not nightly." Split into its own job so
  # this specific gate is visible independent of the rest of the test suite.
  egress-guard-suite:
    name: Egress guard suite (SSRF defense — build blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --all-packages
      - run: uv run pytest packages/security/tests/test_egress_guard.py -v

  # Phase 3's ownership-verification methods fetch the target's own origin
  # (well-known file, meta tag) — the same SSRF surface as the egress guard,
  # so it gets the same build-blocking standard. No service containers
  # needed: this suite is specifically about proving no real DNS/network I/O
  # happens (packages/security/tests/test_ownership.py's own docstring).
  ownership-verification-suite:
    name: Ownership verification suite (network-safety — build blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --all-packages
      - run: uv run pytest packages/security/tests/test_ownership.py -v

  # Phase 6's exit criterion: "proven by test — not just by code review —
  # that no active-tier check is reachable against an unverified target
  # under any code path." Same build-blocking standard as the two suites
  # above; needs real Postgres (temporary_schema()), unlike them.
  tier-gating-suite:
    name: Tier gating suite (active-tier isolation — build blocking)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vigilo
          POSTGRES_PASSWORD: vigilo-dev-secret
          POSTGRES_DB: vigilo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vigilo -d vigilo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://vigilo:vigilo-dev-secret@localhost:5432/vigilo
      # run_scan_job() unconditionally calls put_evidence_bundle(), which
      # raises an uncaught StructuredError if object storage isn't
      # configured at all — these point at nothing reachable (no minio
      # service here, unlike the `test` job), but that's enough: a real
      # connection failure is caught as ObjectStoreError and logged as a
      # warning (jobs.py), which this suite's own assertions (tier and
      # findings only, never bundle_id) don't depend on either way.
      OBJECT_STORE_ENDPOINT: http://localhost:9000
      OBJECT_STORE_ACCESS_KEY: vigilo
      OBJECT_STORE_SECRET_KEY: vigilo-dev-secret
      OBJECT_STORE_BUCKET: vigilo-evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --all-packages
      - run: uv run alembic -c packages/persistence/alembic.ini upgrade head
      - run: uv run pytest packages/orchestrator/tests/test_tier_gating.py -v

  # Phase 8's exit criterion, verbatim: "a deliberately reintroduced
  # misconfiguration on a monitored fixture produces exactly one
  # `regressed` alert — not zero, not four." `detect_regression()` is a
  # pure function (packages/monitoring/src/vigilo_monitoring/diff.py) —
  # no Postgres needed, unlike tier-gating-suite — so this proves the
  # classification itself is correct in isolation from the DB-backed
  # wiring the regular `test` job already covers.
  regression-diff-suite:
    name: Regression diff suite (scan-diff classification — build blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --all-packages
      - run: uv run pytest packages/monitoring/tests/test_diff.py -v

  web:
    name: Web app (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # Nothing previously caught a broken or misformatted Caddyfile before
  # docs/self-hosting.md's "Production VPS deployment" path hit it —
  # the first signal would otherwise be `docker compose up` crash-looping
  # the caddy service on a self-hoster's own box. WEB_DOMAIN/API_DOMAIN
  # are dummy values here only to satisfy the Caddyfile's `{$WEB_DOMAIN}`/
  # `{$API_DOMAIN}` substitution during `caddy validate` — this checks the
  # config is well-formed, not that any real domain is reachable.
  caddy:
    name: Caddyfile (fmt + validate)
    runs-on: ubuntu-latest
    env:
      WEB_DOMAIN: example.com
      API_DOMAIN: api.example.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: caddy fmt --diff
        run: docker run --rm -v "$PWD/Caddyfile:/Caddyfile:ro" caddy:2-alpine caddy fmt --diff /Caddyfile
      - name: caddy validate
        run: |
          docker run --rm -v "$PWD/Caddyfile:/Caddyfile:ro" \
            -e WEB_DOMAIN -e API_DOMAIN \
            caddy:2-alpine caddy validate --config /Caddyfile --adapter caddyfile

  # Phase 9 (docs/self-hosting.md): a broken Dockerfile should fail CI, not
  # surface for the first time when a self-hoster tries to build one. Builds
  # only — no registry push, no credentials needed. apps/web's build args
  # are left unset (their real values are only needed for a working runtime
  # container, not for `next build` to succeed — see apps/web/Dockerfile's
  # own comment on NEXT_PUBLIC_* being build-time-only).
  docker-build:
    name: Docker image build (api, scanner, web)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [api, scanner, web, cli]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          push: false
          tags: vigilo-${{ matrix.image }}:ci

  # The browser suite (apps/web/e2e): real Next.js, the real API, a scanner worker,
  # Postgres and Redis, against a Clerk *development* instance. It signs in with
  # Clerk's testing helper, which needs only a test user's email, so three
  # repository secrets are required (Settings, Secrets and variables, Actions):
  #   E2E_CLERK_PUBLISHABLE_KEY   the dev instance's pk_test_...
  #   E2E_CLERK_SECRET_KEY        the dev instance's sk_test_...
  #   E2E_USER_EMAIL              an existing user in that instance (a throwaway one:
  #                               the specs create organisations, targets and invitations
  #                               in this job's own database, nothing at Clerk but sessions)
  # Without them (or on a pull request from a fork, where GitHub withholds secrets) the
  # job passes with a warning instead of failing. No Stripe or Postmark variables are
  # set, so the tests cannot reach a real payment or email provider.
  e2e:
    name: Browser suite (Playwright, real stack)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vigilo
          POSTGRES_PASSWORD: vigilo-dev-secret
          POSTGRES_DB: vigilo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vigilo -d vigilo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://vigilo:vigilo-dev-secret@localhost:5432/vigilo
      E2E_DATABASE_URL: postgresql://vigilo:vigilo-dev-secret@localhost:5432/vigilo
      REDIS_URL: redis://localhost:6379/0
      OBJECT_STORE_ENDPOINT: http://localhost:9000
      OBJECT_STORE_ACCESS_KEY: vigilo
      OBJECT_STORE_SECRET_KEY: vigilo-dev-secret
      OBJECT_STORE_BUCKET: vigilo-evidence
      WEB_APP_URL: http://localhost:3000
      # The anonymous-scan throttle is covered by the API tests; keep it out of the browser run.
      SCAN_RATE_PER_IP_PER_HOUR: "0"
      SCAN_RATE_PER_EMAIL_PER_HOUR: "0"
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_CLERK_JWT_TEMPLATE: vigilo-api
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
    steps:
      - name: Are the Clerk secrets available?
        id: keys
        run: |
          if [ -n "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" ] && [ -n "$CLERK_SECRET_KEY" ] && [ -n "$E2E_USER_EMAIL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Browser suite skipped: add E2E_CLERK_PUBLISHABLE_KEY, E2E_CLERK_SECRET_KEY and E2E_USER_EMAIL as repository secrets (not available on fork pull requests)."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.keys.outputs.configured == 'true'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        if: steps.keys.outputs.configured == 'true'
        with:
          enable-cache: true
      - run: uv python install 3.11
        if: steps.keys.outputs.configured == 'true'
      - run: uv sync --all-packages
        if: steps.keys.outputs.configured == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.keys.outputs.configured == 'true'
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies and the Playwright browser
        if: steps.keys.outputs.configured == 'true'
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Derive the JWKS URL from the publishable key
        if: steps.keys.outputs.configured == 'true'
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import base64, os
          b = os.environ["NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY"].split("_", 2)[2]
          host = base64.b64decode(b + "=" * (-len(b) % 4)).decode().rstrip("$")
          print(f"CLERK_JWKS_URL=https://{host}/.well-known/jwks.json")
          PY
      - name: Start moto (S3), migrate, start the API and the scanner worker
        if: steps.keys.outputs.configured == 'true'
        run: |
          nohup uv run moto_server -p 9000 > moto.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://localhost:9000/ > /dev/null && break; sleep 1; done
          uv run python -c "
          import boto3
          boto3.client('s3', endpoint_url='http://localhost:9000', aws_access_key_id='vigilo',
                       aws_secret_access_key='vigilo-dev-secret', region_name='us-east-1'
                       ).create_bucket(Bucket='vigilo-evidence')
          "
          uv run alembic -c packages/persistence/alembic.ini upgrade head
          nohup uv run uvicorn vigilo_api.main:app --port 8000 > api.log 2>&1 &
          nohup uv run arq vigilo_scanner.worker.WorkerSettings > worker.log 2>&1 &
          for i in $(seq 1 60); do curl -fs http://localhost:8000/healthz > /dev/null && exit 0; sleep 1; done
          cat api.log
          exit 1
      - name: Run the browser suite
        if: steps.keys.outputs.configured == 'true'
        working-directory: apps/web
        run: npx playwright test
      - name: Keep the evidence when it fails
        if: failure() && steps.keys.outputs.configured == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-failure
          path: |
            apps/web/test-results/
            api.log
            worker.log
            moto.log
          retention-days: 7
