# Self-hosted deployment (docs/self-hosting.md, Phase 9) — builds and runs
# the three application images (apps/api, apps/scanner, apps/web) alongside
# their infrastructure. Distinct from docker-compose.yml, which only runs
# infrastructure for local development against apps run directly with
# `uv run`/`npm run dev`.
#
# Copy .env.example to .env and fill in real values before running:
#   docker compose -f docker-compose.self-host.yml up -d --build
#   docker compose -f docker-compose.self-host.yml exec api \
#     uv run alembic -c packages/persistence/alembic.ini upgrade head
#
# For a production VPS deployment with a real domain and TLS (the `caddy`
# service below), see docs/self-hosting.md's "Production VPS deployment"
# section and scripts/deploy.sh.

name: vigilo-self-host

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vigilo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vigilo-dev-secret}
      POSTGRES_DB: vigilo
    volumes:
      - vigilo_self_host_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigilo -d vigilo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - vigilo_self_host_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # adobe/s3mock, not minio: MinIO's 2025 licensing change pulled every
  # free/anonymous image tag for it across Docker Hub, Bitnami and
  # quay.io — confirmed against a real, authenticated Docker Hub login,
  # the minio/minio repository itself is gone, not merely access-gated
  # (same thing .github/workflows/ci.yml and docker-compose.yml hit).
  # No host port here, same as before — object access only ever went
  # through the api/scanner containers on the internal network, and
  # s3mock has no separate console UI to expose the way minio did.
  minio:
    image: adobe/s3mock:latest
    restart: unless-stopped
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: vigilo-evidence
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    volumes:
      - vigilo_self_host_minio_data:/s3mockroot
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      # Loopback-only — Caddy (below) is the only public entry point.
      # Container-to-container traffic (Caddy -> api) uses the compose
      # network's service name regardless of this binding.
      - "127.0.0.1:8000:8000"
    environment:
      ENV: production
      DATABASE_URL: postgresql+asyncpg://vigilo:${POSTGRES_PASSWORD:-vigilo-dev-secret}@postgres:5432/vigilo
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORE_ENDPOINT: http://minio:9090
      OBJECT_STORE_ACCESS_KEY: vigilo
      OBJECT_STORE_SECRET_KEY: ${OBJECT_STORE_SECRET_KEY:-vigilo-dev-secret}
      OBJECT_STORE_BUCKET: vigilo-evidence
      VIGILO_BRAND_CONFIG_PATH: /app/brand.config.json
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?set CLERK_SECRET_KEY in .env}
      CLERK_JWKS_URL: ${CLERK_JWKS_URL:?set CLERK_JWKS_URL in .env}
      POSTMARK_SERVER_TOKEN: ${POSTMARK_SERVER_TOKEN:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-scans@onenexora.com}
      WEB_APP_URL: ${WEB_APP_URL:-http://localhost:3000}
      ADDITIONAL_CORS_ORIGINS: ${ADDITIONAL_CORS_ORIGINS:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5}
      ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_ID_PRO: ${STRIPE_PRICE_ID_PRO:-}
      STRIPE_PRICE_ID_PRO_YEARLY: ${STRIPE_PRICE_ID_PRO_YEARLY:-}
      STRIPE_PORTAL_CONFIGURATION_ID: ${STRIPE_PORTAL_CONFIGURATION_ID:-}
      # NEXORA Core signs the plan updates it sends for organisations it bills with this shared
      # secret. Unset = POST /v1/internal/org-plan is off (404).
      NEXORA_SYNC_SECRET: ${NEXORA_SYNC_SECRET:-}
      NEXORA_CONSOLE_BILLING_URL: ${NEXORA_CONSOLE_BILLING_URL:-}

  scanner:
    build:
      context: .
      dockerfile: apps/scanner/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ENV: production
      DATABASE_URL: postgresql+asyncpg://vigilo:${POSTGRES_PASSWORD:-vigilo-dev-secret}@postgres:5432/vigilo
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORE_ENDPOINT: http://minio:9090
      OBJECT_STORE_ACCESS_KEY: vigilo
      OBJECT_STORE_SECRET_KEY: ${OBJECT_STORE_SECRET_KEY:-vigilo-dev-secret}
      OBJECT_STORE_BUCKET: vigilo-evidence
      VIGILO_BRAND_CONFIG_PATH: /app/brand.config.json
      WEB_APP_URL: ${WEB_APP_URL:-http://web:3000}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5}
      ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID:-}
      POSTMARK_SERVER_TOKEN: ${POSTMARK_SERVER_TOKEN:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-scans@onenexora.com}

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?set NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY in .env}
        NEXT_PUBLIC_CLERK_JWT_TEMPLATE: ${NEXT_PUBLIC_CLERK_JWT_TEMPLATE:-vigilo-api}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      # Loopback-only — see the api service's identical note above.
      - "127.0.0.1:3000:3000"
    environment:
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?set CLERK_SECRET_KEY in .env}

  # Reverse proxy + automatic HTTPS for a production VPS deployment. Not
  # needed for purely local self-hosting (web/api are still reachable at
  # http://localhost:3000/8000 above) — see docs/self-hosting.md.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN:-}
      API_DOMAIN: ${API_DOMAIN:-}
      EXTRA_WEB_DOMAIN: ${EXTRA_WEB_DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - vigilo_self_host_caddy_data:/data
      - vigilo_self_host_caddy_config:/config

volumes:
  vigilo_self_host_postgres_data:
  vigilo_self_host_redis_data:
  vigilo_self_host_minio_data:
  vigilo_self_host_caddy_data:
  vigilo_self_host_caddy_config:
