[project]
name = "vigilo-workspace"
version = "0.0.0"
description = "Vigilo monorepo workspace root — not published"
requires-python = ">=3.11"
dependencies = []

[tool.uv.workspace]
members = ["packages/*", "apps/*"]
exclude = ["apps/web"]

[dependency-groups]
dev = [
    "moto[s3,server]>=5",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
extend-exclude = ["replica"]
target-version = "py311"
src = [
    "packages/core/src",
    "packages/security/src",
    "packages/probes/src",
    "packages/checks/src",
    "packages/scoring/src",
    "packages/persistence/src",
    "packages/identity/src",
    "packages/project/src",
    "packages/integrations/src",
    "packages/orchestrator/src",
    "packages/reporting/src",
    "packages/billing/src",
    "packages/monitoring/src",
    "packages/notification/src",
    "apps/api/src",
    "apps/cli/src",
    "apps/scanner/src",
    "apps/mcp/src",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Check manifests carry long natural-language descriptions, remediation text
# and reference URLs — content, not logic. Wrapping them would hurt
# readability more than the line-length limit helps here.
"packages/checks/src/vigilo_checks/hdr.py" = ["E501"]
"packages/checks/src/vigilo_checks/tls.py" = ["E501"]
"packages/checks/src/vigilo_checks/ses.py" = ["E501"]
"packages/checks/src/vigilo_checks/leg.py" = ["E501"]
"packages/checks/src/vigilo_checks/dep.py" = ["E501"]
"packages/checks/src/vigilo_checks/cmp.py" = ["E501"]
"packages/checks/src/vigilo_checks/cli.py" = ["E501"]
"packages/checks/src/vigilo_checks/exp.py" = ["E501"]
"packages/checks/src/vigilo_checks/iac.py" = ["E501"]
"packages/checks/src/vigilo_checks/dat.py" = ["E501"]
# Per-check fixture tests are one assertion per line by design (readability
# over strict wrapping) — same rationale as the manifests above.
"packages/checks/tests/test_hdr.py" = ["E501"]
"packages/checks/tests/test_iac.py" = ["E501"]
"packages/checks/tests/test_tls.py" = ["E501"]
"packages/checks/tests/test_registry.py" = ["E501"]
"packages/checks/tests/test_ses.py" = ["E501"]
"packages/checks/tests/test_leg.py" = ["E501"]
"packages/checks/tests/test_dep.py" = ["E501"]
"packages/checks/tests/test_cmp.py" = ["E501"]
"packages/checks/tests/test_cli.py" = ["E501"]
"packages/checks/tests/test_exp.py" = ["E501"]
"packages/checks/tests/test_dat.py" = ["E501"]
"packages/probes/tests/test_backend_probe.py" = ["E501"]
"packages/probes/tests/test_backend_probe_ssrf.py" = ["E501"]
# Ownership-verification detail strings/URLs and per-fixture assertions,
# same rationale as the check manifests/tests above.
"packages/security/src/vigilo_security/ownership.py" = ["E501"]
"packages/security/tests/test_ownership.py" = ["E501"]
# Alembic-autogenerated migrations — mechanically generated `op.f(...)`
# constraint-name calls, not hand-wrapped for readability, same rationale.
"packages/persistence/migrations/versions/*.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Session-scoped so the lru_cache'd SQLAlchemy async engine (vigilo_persistence
# .engine.get_engine) — created once, like it is in a real running process —
# isn't torn down and reused across a new event loop between test functions,
# which asyncpg raises on ("attached to a different loop").
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# Phase 3 added several packages that each have their own test_repository.py
# etc. with no __init__.py in tests/ (matching the existing flat-file
# convention) — importlib mode lets pytest tell same-named files in
# different packages apart without requiring one.
addopts = "--import-mode=importlib"
testpaths = [
    "packages/core/tests",
    "packages/security/tests",
    "packages/probes/tests",
    "packages/checks/tests",
    "packages/scoring/tests",
    "packages/persistence/tests",
    "packages/identity/tests",
    "packages/project/tests",
    "packages/integrations/tests",
    "packages/orchestrator/tests",
    "packages/reporting/tests",
    "packages/billing/tests",
    "packages/monitoring/tests",
    "packages/notification/tests",
    "apps/api/tests",
    "apps/cli/tests",
    "apps/scanner/tests",
    "apps/mcp/tests",
]
